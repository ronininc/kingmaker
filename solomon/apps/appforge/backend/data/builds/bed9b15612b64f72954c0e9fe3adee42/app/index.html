<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Booking Barbershop Services App</title>
<style>
  :root { --bg:#0b0b0d; --panel:#141418; --line:#26262e; --gold:#e8c15a; --gold-dim:#b9902e;
          --text:#ececec; --muted:#9a9aa2; --user:#1c1c22; }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text);
    font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:16px 22px; border-bottom:1px solid var(--line); }
  .crest { width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff2cf,var(--gold) 40%,var(--gold-dim) 72%,#5c4514 100%);
    box-shadow:0 0 16px rgba(232,193,90,.3); }
  header h1 { font-size:17px; margin:0; font-weight:650; }
  .wrap { max-width:1000px; margin:0 auto; padding:22px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .tab { padding:9px 14px; border:1px solid var(--line); border-radius:10px; background:var(--panel);
    color:var(--muted); cursor:pointer; font-weight:600; }
  .tab.active { color:#211a06; background:linear-gradient(180deg,var(--gold),var(--gold-dim)); border-color:transparent; }
  .bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .bar h2 { margin:0; font-size:18px; }
  .btn { background:linear-gradient(180deg,var(--gold),var(--gold-dim)); color:#211a06; border:0;
    border-radius:10px; padding:10px 15px; font-weight:700; cursor:pointer; }
  .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; overflow:hidden; }
  th,td { text-align:left; padding:11px 13px; border-bottom:1px solid var(--line); font-size:14px; }
  th { color:var(--gold); font-weight:600; } tr:last-child td { border-bottom:0; }
  .row-actions a { color:var(--muted); cursor:pointer; margin-right:12px; }
  .empty { color:var(--muted); padding:24px; text-align:center; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:16px;
    padding:22px; width:min(520px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label { font-size:13px; color:var(--muted); }
  input,textarea,select { background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:10px 12px; font:inherit; }
  textarea { min-height:80px; resize:vertical; } .req { color:var(--gold); }
  .dlg-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:8px; }
  .foot { color:var(--muted); font-size:12px; margin-top:20px; }
</style>
</head>
<body>
<header><div class="crest"></div><h1 id="appName">Booking Barbershop Services App</h1></header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="bar"><h2 id="entityTitle"></h2><button class="btn" id="newBtn">+ New</button></div>
  <div id="tableHost"></div>
  <div class="foot" id="foot"></div>
</div>

<dialog id="dlg">
  <h2 id="dlgTitle" style="margin:0 0 16px">Record</h2>
  <form id="form"></form>
  <div class="dlg-actions">
    <button class="btn ghost" id="cancelBtn" type="button">Cancel</button>
    <button class="btn" id="saveBtn" type="button">Save</button>
  </div>
</dialog>

<script>
const SPEC = {"name": "Booking Barbershop Services App", "description": "A booking app for my barbershop with services, staff, and appointments, plus a customer login", "entities": [{"name": "Appointment", "fields": [{"name": "Title", "type": "string", "required": true, "slug": "title"}, {"name": "Description", "type": "text", "required": false, "slug": "description"}, {"name": "Status", "type": "string", "required": false, "slug": "status"}, {"name": "Date", "type": "date", "required": false, "slug": "date"}], "slug": "appointment"}], "auth": {"enabled": true, "roles": ["user", "admin"]}, "pages": [{"name": "Appointment list", "entity": "Appointment", "kind": "list"}, {"name": "New Appointment", "entity": "Appointment", "kind": "form"}]};
const APP_KEY = "ronin_" + (SPEC.name || "app").toLowerCase().replace(/[^a-z0-9]+/g, "_");
let current = SPEC.entities[0];
let editingId = null;

const storeKey = (ent) => `${APP_KEY}_${ent.slug}`;
const load = (ent) => { try { return JSON.parse(localStorage.getItem(storeKey(ent))) || []; } catch { return []; } };
const save = (ent, rows) => localStorage.setItem(storeKey(ent), JSON.stringify(rows));
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));

function renderTabs() {
  const host = document.getElementById("tabs"); host.innerHTML = "";
  for (const ent of SPEC.entities) {
    const b = document.createElement("button");
    b.className = "tab" + (ent.slug === current.slug ? " active" : "");
    b.textContent = ent.name; b.onclick = () => { current = ent; renderAll(); };
    host.appendChild(b);
  }
}
function renderTable() {
  document.getElementById("entityTitle").textContent = current.name;
  const rows = load(current), host = document.getElementById("tableHost");
  if (!rows.length) { host.innerHTML = `<div class="empty">No ${esc(current.name)} records yet. Click “+ New”.</div>`; return; }
  const cols = current.fields.slice(0, 5);
  host.innerHTML = `<table><thead><tr>${cols.map(f => `<th>${esc(f.name)}</th>`).join("")}<th></th></tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map(f => `<td>${esc(r[f.slug])}</td>`).join("")}
      <td class="row-actions"><a data-edit="${r._id}">Edit</a><a data-del="${r._id}">Delete</a></td></tr>`).join("")}</tbody></table>`;
  host.querySelectorAll("[data-edit]").forEach(a => a.onclick = () => openForm(a.dataset.edit));
  host.querySelectorAll("[data-del]").forEach(a => a.onclick = () => { save(current, load(current).filter(x => x._id !== a.dataset.del)); renderTable(); });
}
function inputFor(f, val) {
  const v = esc(val);
  if (f.type === "text") return `<textarea name="${f.slug}">${v}</textarea>`;
  if (f.type === "boolean") return `<select name="${f.slug}"><option value="false"${val ? "" : " selected"}>No</option><option value="true"${val ? " selected" : ""}>Yes</option></select>`;
  const t = { number:"number", date:"date", email:"email", url:"url" }[f.type] || "text";
  return `<input type="${t}" name="${f.slug}" value="${v}"${f.required ? " required" : ""}>`;
}
function openForm(id) {
  editingId = id || null;
  const rows = load(current); const rec = id ? rows.find(r => r._id === id) || {} : {};
  document.getElementById("dlgTitle").textContent = (id ? "Edit " : "New ") + current.name;
  document.getElementById("form").innerHTML = current.fields.map(f =>
    `<div class="field"><label>${esc(f.name)}${f.required ? ' <span class="req">*</span>' : ""}</label>${inputFor(f, rec[f.slug])}</div>`).join("");
  document.getElementById("dlg").showModal();
}
function saveForm() {
  const form = document.getElementById("form"); const data = {};
  for (const f of current.fields) {
    const el = form.elements[f.slug]; let v = el ? el.value : "";
    if (f.type === "boolean") v = v === "true"; if (f.type === "number") v = v === "" ? "" : Number(v);
    if (f.required && (v === "" || v === null)) { el.focus(); return; }
    data[f.slug] = v;
  }
  const rows = load(current);
  if (editingId) { const i = rows.findIndex(r => r._id === editingId); if (i >= 0) rows[i] = { ...rows[i], ...data }; }
  else { data._id = uid(); data._created = new Date().toISOString(); rows.unshift(data); }
  save(current, rows); document.getElementById("dlg").close(); renderTable();
}
function renderAll() { renderTabs(); renderTable(); }
document.getElementById("newBtn").onclick = () => openForm(null);
document.getElementById("saveBtn").onclick = saveForm;
document.getElementById("cancelBtn").onclick = () => document.getElementById("dlg").close();
document.getElementById("foot").textContent =
  (SPEC.auth && SPEC.auth.enabled ? "Auth roles: " + (SPEC.auth.roles || []).join(", ") + " · " : "") +
  "Generated by Ronin App Forge · data stored locally in this browser.";
renderAll();
</script>
</body>
</html>

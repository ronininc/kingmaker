<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingmaker — Light Runtime</title>
<style>
  :root {
    --field: #08080a; --rail: #0b0b0d; --card: #101013; --line: #26262b;
    --ink: #d7d7db; --dim: #8a8a92; --faint: #66666e;
    --amber: #f5c518; --tile: #f2f2f4; --active: #17171b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #050506; }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink); padding: 28px 18px 40px;
    display: flex; justify-content: center;
  }
  .window {
    width: 1060px; max-width: 100%;
    background: var(--field); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden;
  }
  /* ── title bar ─────────────────────────── */
  .titlebar {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .dots { display: flex; gap: 8px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #2c2c31; }
  .dot.amber { background: var(--amber); }
  .name { font-size: 13px; font-weight: 800; letter-spacing: 4px; color: #f2f2f4; }
  .vtag { font-size: 9px; letter-spacing: 2px; color: var(--faint); text-transform: uppercase; }
  .pill {
    margin-left: auto; background: var(--tile); color: #0a0a0c;
    font-size: 9.5px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
    padding: 5px 12px; border-radius: 999px; white-space: nowrap;
  }
  /* ── frame: rail + main ────────────────── */
  .frame { display: flex; min-height: 560px; }
  .rail {
    width: 118px; flex: 0 0 118px; background: var(--rail);
    border-right: 1px solid var(--line); padding: 16px 0;
  }
  .rail button {
    display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    font: inherit; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--dim); padding: 9px 14px; border-left: 2px solid transparent;
  }
  .rail button.on { color: #f2f2f4; background: var(--active); border-left-color: var(--amber); }
  main { flex: 1; padding: 22px 26px 26px; min-width: 0; }
  .view { display: none; }
  .view.on { display: block; }
  h1 { font-size: 15px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #f2f2f4; }
  .sub { font-size: 9.5px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--faint); margin: 6px 0 18px; }
  /* ── evidence cards ────────────────────── */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 13px 16px 11px; margin-bottom: 12px;
    animation: land .45s ease both; animation-delay: calc(var(--i, 0) * 90ms);
  }
  .noanim .card, .noanim .tile { animation: none; }
  .chead {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim);
    display: flex; gap: 10px; align-items: center; margin-bottom: 8px;
  }
  .tag {
    color: var(--amber); border: 1px solid var(--amber); border-radius: 3px;
    padding: 1px 5px; font-size: 8.5px; letter-spacing: 1.6px;
  }
  .tag.real { color: var(--dim); border-color: var(--line); }
  .cbody { font-size: 12.5px; line-height: 1.65; color: var(--ink); }
  .cbody .row { display: flex; justify-content: space-between; gap: 18px; padding: 2px 0; }
  .cbody .k { color: var(--dim); text-transform: uppercase; font-size: 10px; letter-spacing: 1.6px; padding-top: 2px; }
  .csrc { font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--faint); margin-top: 9px; }
  mark {
    background-image: linear-gradient(var(--amber), var(--amber));
    background-repeat: no-repeat; background-size: 0% 100%;
    color: #0a0a0c; padding: 0 3px; font-weight: 700;
    animation: sweep .6s ease forwards; animation-delay: calc(var(--i, 0) * 90ms + 250ms);
  }
  .hl { position: relative; white-space: nowrap; }
  .cursor {
    position: absolute; right: -13px; top: 7px; width: 12px; height: 12px;
    animation: travel .6s ease both; animation-delay: calc(var(--i, 0) * 90ms + 250ms);
  }
  /* ── ticker tiles ──────────────────────── */
  .tiles { display: flex; gap: 12px; margin: 18px 0 6px; }
  .tile {
    flex: 1; background: var(--tile); color: #0a0a0c; border-radius: 6px; padding: 14px 14px 11px;
    animation: stamp .35s ease both; animation-delay: calc(400ms + var(--i, 0) * 110ms);
  }
  .tile .num { font-size: 24px; font-weight: 800; letter-spacing: .5px; }
  .tile .lab { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: #55555c; margin-top: 5px; }
  /* ── controls ──────────────────────────── */
  .ctl { display: flex; align-items: center; gap: 14px; padding: 7px 0; }
  .ctl .what { flex: 1; }
  .ctl .what b { font-size: 12px; color: #f2f2f4; font-weight: 700; }
  .ctl .what span { display: block; font-size: 10px; color: var(--dim); margin-top: 2px; line-height: 1.5; }
  .ctl .state { font-size: 9.5px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--amber); min-width: 92px; text-align: right; }
  .ctl button {
    font: inherit; font-size: 9.5px; letter-spacing: 1.8px; text-transform: uppercase; cursor: pointer;
    background: none; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 7px 12px;
  }
  .ctl button:hover { border-color: var(--amber); color: #f2f2f4; }
  /* ── footer ────────────────────────────── */
  footer { border-top: 1px solid var(--line); padding: 14px 26px 18px; }
  footer .line1 { font-size: 11.5px; color: var(--dim); }
  footer .close { font-size: 13px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #f2f2f4; margin-top: 8px; }
  .empty { color: var(--dim); font-size: 12.5px; line-height: 1.65; }
  @keyframes land { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  @keyframes sweep { from { background-size: 0% 100%; } to { background-size: 100% 100%; } }
  @keyframes travel { from { transform: translateX(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes stamp { from { opacity: 0; transform: scale(1.07); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } mark { background-size: 100% 100%; } }
</style>
</head>
<body>
<div class="window" id="win">
  <div class="titlebar">
    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot amber"></span></div>
    <div class="name">KINGMAKER</div>
    <div class="vtag">Light runtime · proof surface</div>
    <div class="pill" id="pill">LOADING</div>
  </div>
  <div class="frame">
    <nav class="rail" id="rail"></nav>
    <main id="main"></main>
  </div>
  <footer>
    <div class="line1">Every number on this wall is computed from the run's own stages and the meter's own log. Simulated stages are labeled, and they never certify the target.</div>
    <div class="close">Read everything · Write little</div>
  </footer>
</div>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtInt = (n) => (n === null || n === undefined ? '—' : Math.round(n).toLocaleString('en-US'));
const fmtTokS = (v) => (v === null || v === undefined ? '—' : v >= 100 ? String(Math.round(v)) : v.toFixed(1));
const fmtDate = (iso) => { const d = iso ? new Date(iso) : null; return d && !Number.isNaN(d) ? d.toISOString().slice(0, 10) : '—'; };
const CURSOR = '<svg class="cursor" viewBox="0 0 24 24"><path d="M5 3 L19 12 L12.5 13.5 L15 21 L12.5 22 L10 14.5 L5.5 18 Z" fill="#fff" stroke="#000" stroke-width="1.6"/></svg>';
const hl = (text) => `<span class="hl"><mark>${esc(text)}</mark>${CURSOR}</span>`;

const NAV = [
  ['overview', 'Overview'], ['router', 'Router'], ['evidence', 'Evidence Wall'],
  ['library', 'Library'], ['gates', 'Gates'], ['audit', 'Audit Chain'],
];
let view = new URLSearchParams(location.search).get('view') || 'overview';
if (!NAV.some(([k]) => k === view)) view = 'overview';
let state = null;
let animated = false;

function card({ i = 0, head, tag = '', body, src }) {
  return `<section class="card" style="--i:${i}">
    <div class="chead"><span>${esc(head)}</span>${tag}</div>
    <div class="cbody">${body}</div>
    ${src ? `<div class="csrc">Source · ${esc(src)}</div>` : ''}
  </section>`;
}
const rows = (pairs) => pairs.map(([k, v]) => `<div class="row"><span class="k">${esc(k)}</span><span>${v}</span></div>`).join('');

function overviewView(s) {
  let i = 0; const out = [];
  out.push(`<h1>Overview</h1><div class="sub">${esc(s.machine ? `${s.machine.label} · ${s.machine.chip ?? 'chip unknown'} · ${s.machine.ramGb ?? '—'} GB` : 'Machine profile unavailable')}</div>`);
  if (s.machine) {
    out.push(card({ i: i++, head: 'This Mac · the seats', body: rows([
      ...s.seats.map((x) => [x.role, esc(String(x.model ?? '—').replace(/^huihui_ai\//, '').replace(/^hf\.co\//, ''))]),
      ['At once', `${s.machine.concurrent} model · ${(s.machine.context / 1024)}k context · up to ${s.machine.maxResidentGb} GB each`],
    ]), src: `mac profile · lib/mac-profiles.mjs · ${fmtDate(s.generatedAt)}` }));
  }
  if (s.seatPlan) {
    const p = s.seatPlan;
    const body = p.active
      ? `<div class="row"><span class="k">Reflex seat</span><span>${hl(`${p.model} pinned`)} — seat ${p.seatGb} GB + worker up to ${p.workerGb} GB = ${p.pairGb} GB of the ${p.budgetGb} GiB GPU budget</span></div>`
      : rows([['Reflex seat', `not pinned — ${esc(p.reason ?? 'the strict single-model rule stands')}`]]);
    out.push(card({ i: i++, head: 'Co-residency · the 8 GB exception', body, src: 'lib/reflex-seat.mjs · the seat plan for this profile' }));
  }
  if (s.meter) {
    const m = s.meter;
    out.push(card({ i: i++, head: 'The meter · what the models actually did', body: rows([
      ['Decode', m.decodeTokS === null ? 'no live window on this surface' : `${fmtTokS(m.decodeTokS)} t/s`],
      ['Prefill', m.prefillTokS === null ? '—' : `${fmtTokS(m.prefillTokS)} t/s`],
      ['Tokens', `${fmtInt(m.prompt)} read · ${fmtInt(m.generated)} written`],
    ]), src: `token meter · lib/token-meter.mjs · since ${m.since ? fmtDate(m.since) : 'the metrics log'}` }));
  }
  const c = s.control;
  const ctl = (what, note, st, btn, patch) => `<div class="ctl"><div class="what"><b>${what}</b><span>${note}</span></div><div class="state">${st}</div><button data-patch='${JSON.stringify(patch)}'>${btn}</button></div>`;
  out.push(card({ i: i++, head: 'Controls · this machine only', body:
    ctl('10M token proof', 'An intent flag. The runner takes it, clears it, and writes the report this wall reads.', c.proofRun === 'start' ? 'run requested' : c.proofRun === 'stop' ? 'stop requested' : 'idle', c.proofRun === 'start' ? 'Request stop' : 'Start the run', { proofRun: c.proofRun === 'start' ? 'stop' : 'start' })
    + ctl('Reflex layer', 'Typed decisions answered in one forward pass, before any big model wakes. Off restores the legacy flow.', s.reflex.enabled ? 'on' : 'off', s.reflex.enabled ? 'Turn off' : 'Turn on', { reflex: !c.reflex })
    + ctl('Reflex seat pin', 'The decision model pinned beside the worker on the 8 GB profile. Off restores the strict single slot.', s.reflex.pinEnabled ? 'on' : 'off', s.reflex.pinEnabled ? 'Turn off' : 'Turn on', { reflexPin: !c.reflexPin }),
    src: 'control.json · written by this surface, read by the engine' }));
  if (s.proof) {
    const t = s.proof.tiles, v = s.proof.target;
    out.push(card({ i: i++, head: `The proof · target ${v.tokPerSec} t/s`, body: rows([
      ['Verdict', hl(v.state) ],
      ['Sustained', `${fmtTokS(t.sustainedTokPerSec)} t/s over ${fmtInt(t.totalTokens)} tokens`],
      ['Peak stage', `${fmtTokS(t.peakTokPerSec)} t/s`],
      ['Write share', t.writeSharePct === null ? '—' : `${t.writeSharePct}% of tokens were written; the rest were read`],
    ]), src: `proof report · ${fmtDate(s.proof.at)} · the full wall is under Evidence` }));
  } else if (s.proofError) {
    out.push(card({ i: i++, head: 'The proof · report unreadable', body: `<span class="empty">${esc(s.proofError)}</span>`, src: 'proof-report.json · validation in light-runtime/state-schema.mjs' }));
  } else {
    out.push(card({ i: i++, head: 'The proof · not run yet', body: '<span class="empty">No proof report on this machine. Start the run from the controls above; the wall fills when the runner reports.</span>', src: 'proof-report.json · absent' }));
  }
  return out.join('');
}

function evidenceView(s) {
  let i = 0; const out = [];
  out.push(`<h1>Evidence Wall</h1><div class="sub">The 10M token proof · every claim carries its source</div>`);
  if (!s.proof) {
    out.push(card({ i: i++, head: 'No proof yet', body: '<span class="empty">Nothing has been measured on this machine. A verdict is never drawn from an empty wall.</span>', src: 'proof-report.json · absent' }));
    return out.join('');
  }
  const t = s.proof.tiles;
  const tiles = [
    [fmtInt(t.totalTokens), 'Tokens'], [`${fmtTokS(t.sustainedTokPerSec)}`, 'Sustained t/s'],
    [`${fmtTokS(t.peakTokPerSec)}`, 'Peak t/s'], [t.writeSharePct === null ? '—' : `${t.writeSharePct}%`, 'Write share'],
  ];
  out.push(`<div class="tiles">${tiles.map(([n, l], j) => `<div class="tile" style="--i:${j}"><div class="num">${esc(n)}</div><div class="lab">${esc(l)}</div></div>`).join('')}</div>`);
  s.proof.stages.forEach((st, j) => {
    const tag = st.kind === 'SIMULATED' ? '<span class="tag">Simulated</span>' : '<span class="tag real">Real</span>';
    const body = st.tokPerSec === null
      ? `Carried ${hl(fmtInt(st.tokens) + ' tokens')} — no rate was measured for this stage.`
      : `Carried ${fmtInt(st.tokens)} tokens at ${hl(fmtTokS(st.tokPerSec) + ' t/s')}${st.seconds ? ` over ${st.seconds}s` : ''}.`;
    out.push(card({ i: i++, head: `Stage ${j + 1} · ${st.label}`, tag, body, src: `${st.source ?? 'proof runner'} · ${fmtDate(s.proof.at)}` }));
  });
  (s.verdicts ?? []).forEach((v) => {
    const body = `${v.question ? esc(v.question) + ' → ' : ''}${hl(`${v.answer ?? 'no scored answer'}${v.probability !== null && v.probability !== undefined ? ` (${Number(v.probability).toFixed(2)})` : ''}`)}${v.ms ? ` · ${v.ms} ms, no big model woken` : ''}`;
    out.push(card({ i: i++, head: `Reflex verdict · ${v.model ?? 'decision model'}`, body, src: `reflex audit · ${fmtDate(v.at)}` }));
  });
  return out.join('');
}

const EMPTY = {
  router: ['Router', 'Lane decisions belong to the reflex layer and the fast route inside the engine. Its latest verdicts are on the Evidence Wall — this window does not draw the lanes.'],
  library: ['Library', 'The brain library is chosen in Customize and served by the installer. This window shows the seats this Mac actually runs — see Overview.'],
  gates: ['Gates', 'Approvals are your word at the bar. Never a click — and never in this window. Nothing here can approve, send, or spend.'],
  audit: ['Audit Chain', 'The audit chain is append-only engine state. This window reads computed summaries; the chain itself is read from the engine, not rendered here.'],
};
function emptyView(key) {
  const [title, text] = EMPTY[key];
  return `<h1>${title}</h1><div class="sub">Not in the light runtime</div>` +
    card({ i: 0, head: 'Honest empty state', body: `<span class="empty">${esc(text)}</span>`, src: 'design ruling · the light runtime is a presentation surface, not a workflow editor' });
}

function render() {
  if (!state) return;
  $('#pill').textContent = state.pill;
  $('#rail').innerHTML = NAV.map(([k, l]) => `<button data-view="${k}" class="${view === k ? 'on' : ''}">${l}</button>`).join('');
  const main = $('#main');
  main.innerHTML = view === 'overview' ? overviewView(state)
    : view === 'evidence' ? evidenceView(state) : emptyView(view);
  if (animated) $('#win').classList.add('noanim'); else animated = true;
  main.querySelectorAll('[data-patch]').forEach((b) => b.addEventListener('click', async () => {
    b.disabled = true;
    try {
      await fetch('/control', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(JSON.parse(b.dataset.patch)) });
    } finally { load(); }
  }));
}
$('#rail').addEventListener('click', (e) => {
  const b = e.target.closest('[data-view]');
  if (b) { view = b.dataset.view; $('#win').classList.remove('noanim'); animated = false; render(); }
});
async function load() {
  try { state = await (await fetch('/state')).json(); render(); }
  catch { $('#pill').textContent = 'SURFACE OFFLINE'; }
}
load();
setInterval(load, 5000);
</script>
</body>
</html>

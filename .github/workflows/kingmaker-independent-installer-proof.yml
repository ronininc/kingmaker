name: Kingmaker independent installer evidence
on:
  push:
    branches: [ci/standalone-proof-4ada7c2]
permissions:
  contents: read
jobs:
  installer:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4ada7c23ed640da54bacd855284a4b0e0620b29f
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node --test test/installer-look.test.mjs
      - run: swiftc -typecheck -parse-as-library -target arm64-apple-macos14.0 installer/KingmakerInstaller.swift -framework SwiftUI -framework AppKit
      - run: |
          node --test test/standalone-installer.test.mjs test/installer-signature.test.mjs

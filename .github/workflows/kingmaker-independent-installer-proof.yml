name: Kingmaker independent installer evidence
on:
  push:
    branches: [candidate/kingmaker-standalone-entry]
permissions:
  contents: read
jobs:
  installer:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node --test test/installer-look.test.mjs
      - run: swiftc -typecheck -parse-as-library -target arm64-apple-macos14.0 installer/KingmakerInstaller.swift -framework SwiftUI -framework AppKit
      - run: |
          node --test --test-name-pattern='Kingmaker installs undocked' test/installer.test.mjs

name: Test Kingmaker candidate

on:
  workflow_dispatch: {}
  push:
    branches:
      - candidate/8gb-integrated

permissions:
  contents: read

jobs:
  node-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.15.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

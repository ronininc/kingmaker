name: Test Kingmaker candidate

on:
  workflow_dispatch: {}
  push:
    branches:
      - candidate/8gb-integrated

permissions:
  contents: read

jobs:
  node-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The CLI requires node:sqlite (>=22.13); SYSTEM-REQUIREMENTS.md
          # names Node 24 as the supported full-suite lane.
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install deterministic media test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run deterministic test shard
        env:
          KINGMAKER_TEST_SHARD: ${{ matrix.shard }}
          KINGMAKER_TEST_SHARDS: 4
          KINGMAKER_TEST_FILE_TIMEOUT_MS: 180000
          KINGMAKER_TEST_OUTPUT_DIR: test-results
        run: node scripts/run-test-shard.mjs
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingmaker-test-shard-${{ matrix.shard }}
          path: test-results/

name: Test Kingmaker candidate

on:
  workflow_dispatch: {}
  push:
    branches:
      - candidate/8gb-integrated

permissions:
  contents: read

jobs:
  node-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.15.1
          cache: npm
      - run: npm ci --ignore-scripts
      # package.json quotes these globs for zsh compatibility; expand them in
      # bash so Node receives the actual files on the disposable Linux host.
      - run: node --test --test-force-exit test/*.test.mjs addons/*/test/*.test.mjs

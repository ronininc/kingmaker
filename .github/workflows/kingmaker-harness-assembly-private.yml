name: Kingmaker private harness assembly

# A branch push never starts this job. The exact CI tag may only be pushed
# after explicitly approving the job and its dedicated runner.
on:
  workflow_dispatch:
  push:
    tags: ['ci-proof-kingmaker-harness-8af0839']

permissions:
  contents: read

concurrency:
  group: kingmaker-private-harness-assembly
  cancel-in-progress: false

env:
  KINGMAKER_SHA: 8af0839ddd06ae16f441ed51fe763d5d50235ba8
  TSS_SHA: 4d514a623d51f78b0faed0d0edabd41b5e279cfd
  MINIMUM_FREE_KIB: '33554432'

jobs:
  assemble:
    if: github.repository == 'ronininc/kingmaker' && github.event.repository.private == true
    # Default hosted ARM64 macOS runners expose only 14 GB of SSD. Never
    # substitute them or lower the existing 32 GiB release-host floor.
    runs-on: [self-hosted, macOS, ARM64, kingmaker-assembly-arm64]
    timeout-minutes: 75
    steps:
      - name: Require a dedicated Apple silicon host and measured release scratch
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s):$(uname -m)" = Darwin:arm64
          for scratch in "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; do
            test -d "$scratch" && test -w "$scratch"
            row="$(df -kP "$scratch" | awk 'NR==2 {print $1, $4}')"
            read -r device free_kib <<< "$row"
            fs="$(diskutil info -plist "$device" | plutil -extract FilesystemType raw -)"
            [[ "$fs" == apfs && "$free_kib" =~ ^[0-9]+$ && "$free_kib" -ge "$MINIMUM_FREE_KIB" ]] || {
              echo "::error::Assembly requires writable APFS with at least 32 GiB free before checkout or downloads."
              exit 1
            }
            printf 'Release scratch: %s KiB free on APFS\n' "$free_kib"
          done
          for cmd in python3.13 cmake ollama gh; do command -v "$cmd" >/dev/null; done
          xcrun --find swiftc >/dev/null
          if command -v docker >/dev/null && docker info >/dev/null 2>&1; then
            echo "::error::This dedicated private assembly runner must not have a live Docker daemon."
            exit 1
          fi
          printf 'BUILD_STARTED_AT=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Check out the reviewed assembly helper only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: assembly-recipe
          persist-credentials: false
          sparse-checkout: |
            scripts/ci-build-fresh-harness-runtime.sh
            scripts/ci-fresh-harness-receipt.mjs
          sparse-checkout-cone-mode: false

      - name: Check out the exact private Kingmaker source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.KINGMAKER_SHA }}
          path: kingmaker
          persist-credentials: false

      - name: Require an explicit TSS-only checkout route
        shell: bash
        env:
          PRESEEDED_TSS: ${{ vars.KINGMAKER_APPROVED_TSS_SOURCE_ROOT }}
          TSS_READER: ${{ secrets.KINGMAKER_TSS_CONTENTS_READ }}
        run: |
          set -euo pipefail
          if [[ -n "$PRESEEDED_TSS" ]]; then
            [[ "$PRESEEDED_TSS" == /* ]]
            git -C "$PRESEEDED_TSS" cat-file -e "$TSS_SHA^{commit}"
            GIT_LFS_SKIP_SMUDGE=1 git clone --shared --no-checkout -- "$PRESEEDED_TSS" "$GITHUB_WORKSPACE/engine"
            GIT_LFS_SKIP_SMUDGE=1 git -C "$GITHUB_WORKSPACE/engine" checkout --detach "$TSS_SHA"
          elif [[ -z "$TSS_READER" ]]; then
            echo "::error::Supply the approved exact TSS checkout on this build host or a short-lived TSS-only contents-read grant."
            exit 1
          fi

      - name: Check out the exact private TSS engine when it is not preseeded
        if: vars.KINGMAKER_APPROVED_TSS_SOURCE_ROOT == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ronininc/TSS
          ref: ${{ env.TSS_SHA }}
          token: ${{ secrets.KINGMAKER_TSS_CONTENTS_READ }}
          path: engine
          persist-credentials: false

      - name: Bind both exact checkouts and initialize disposable workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C kingmaker rev-parse HEAD)" = "$KINGMAKER_SHA"
          test "$(git -C engine rev-parse HEAD)" = "$TSS_SHA"
          test -z "$(git -C engine status --porcelain --untracked-files=no)"
          stage="$(mktemp -d "$RUNNER_TEMP/km-assembly.XXXXXX")"
          echo "ASSEMBLY_STAGE=$stage" >> "$GITHUB_ENV"

      - name: Install build-only Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'

      - name: Acquire and verify the existing pinned Mac binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=kingmaker-runtime-tools-arm64-2026-11-24.tar.gz
          gh release download kingmaker-build-inputs-2026-11-24 -R ronininc/kingmaker \
            --pattern "$name" --dir "$ASSEMBLY_STAGE"
          (
            cd "$ASSEMBLY_STAGE"
            printf '%s  %s\n' 02c4cd7add03ccf61ffa420541ad17ba5a10e28058e61c8945cf70aae1b80035 "$name" | shasum -a 256 -c -
          )
          mkdir -p kingmaker/app/Resources
          tar -xzf "$ASSEMBLY_STAGE/$name" -C kingmaker/app/Resources bin/ffmpeg bin/ffprobe bin/uv bin/uvx
          for bin in ffmpeg ffprobe uv uvx; do
            test -x "kingmaker/app/Resources/bin/$bin"
            lipo -verify_arch arm64 "kingmaker/app/Resources/bin/$bin"
          done

      - name: Build every runtime from the approved current sources
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash assembly-recipe/scripts/ci-build-fresh-harness-runtime.sh \
            "$GITHUB_WORKSPACE/engine" "$GITHUB_WORKSPACE/kingmaker" "$ASSEMBLY_STAGE"

      - name: Assert complete app and prove the installer entry point
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/engine/desktop/dist-ghost/Kingmaker.app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep 'Signature=adhoc'
          lipo -verify_arch arm64 "$app/Contents/MacOS/KingmakerEngine"
          mkdir "$ASSEMBLY_STAGE/receipt"
          node assembly-recipe/scripts/ci-fresh-harness-receipt.mjs \
            "$GITHUB_WORKSPACE/kingmaker" "$GITHUB_WORKSPACE/engine" "$app" \
            "$ASSEMBLY_STAGE/guardrails-pre-sign.json" "$ASSEMBLY_STAGE/receipt/build-provenance.json" "$BUILD_STARTED_AT"
          node --test kingmaker/test/standalone-installer.test.mjs kingmaker/test/installer-signature.test.mjs \
            kingmaker/test/release-issuance.test.mjs kingmaker/test/release-low-disk.test.mjs

      - name: Calculate fresh part pins through the streaming preview
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$ASSEMBLY_STAGE/receipt" <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { main } from './kingmaker/scripts/release-parts.mjs';
          const lines = [];
          const app = join(process.env.GITHUB_WORKSPACE, 'engine', 'desktop', 'dist-ghost', 'Kingmaker.app');
          const rc = await main({
            argv: ['--app', app, '--tree-commit', process.env.KINGMAKER_SHA, '--tree-repo', 'ronininc/kingmaker',
              '--harness-only', '--deterministic', '--dry-run', '--offline', '--part-size', '300000000'],
            env: { KINGMAKER_ALLOW_ADHOC: '1', PATH: process.env.PATH },
            offlineDigests: async () => ({}),
            out: line => lines.push(line),
          });
          if (rc) throw Error(lines.join('\n'));
          const m = JSON.parse(lines.at(-1));
          if (m.distribution !== 'harness-only' || m.issuance?.tree?.commit !== process.env.KINGMAKER_SHA)
            throw Error('Current build did not produce a source-bound preview');
          writeFileSync(join(process.argv[2], 'private-preview-do-not-publish.json'), JSON.stringify({
            purpose:'Fresh private ad-hoc bytes only; re-sign, restage, rehash and sign the manifest in the owner lane',
            preview:m
          },null,2)+'\n',{flag:'wx'});
          NODE

      - name: Create bounded private candidate archive and pins
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/engine/desktop/dist-ghost/Kingmaker.app"
          out="$ASSEMBLY_STAGE/receipt"
          remaining="$(df -kP "$out" | awk 'NR==2 {print $4}')"
          [[ "$remaining" =~ ^[0-9]+$ && "$remaining" -ge 8388608 ]]
          ditto -c -k --keepParent "$app" "$out/Kingmaker-adhoc-not-for-customers.zip"
          size="$(stat -f %z "$out/Kingmaker-adhoc-not-for-customers.zip")"
          test "$size" -le 5368709120
          unzip -tq "$out/Kingmaker-adhoc-not-for-customers.zip"
          (
            cd "$out"
            shasum -a 256 Kingmaker-adhoc-not-for-customers.zip build-provenance.json private-preview-do-not-publish.json > SHA256SUMS
          )

      - name: Retain private candidate for owner-lane verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kingmaker-8af0839-private-ad-hoc
          path: ${{ env.ASSEMBLY_STAGE }}/receipt
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

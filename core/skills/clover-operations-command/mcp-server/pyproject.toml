[project]
name = "clover-operations-mcp"
version = "0.1.0"
description = "Guarded Clover remote MCP connector for Operations Command"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.24,<2",
]

[project.scripts]
clover-mcp = "clover_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clover_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]

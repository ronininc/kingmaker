# Scripture Armor — Loop DNS for systemd-resolved (Linux)
#
# WHAT THIS DOES: points this machine's DNS lookups at a resolver running
# inside your own closed loop, over DNS over TLS, failing closed.
# WHAT THIS DOES NOT DO: wrap all traffic. This is the DNS layer — the
# queries. Full-traffic wrap is the VPN posture, separate by design.
#
# OPERATOR PLACEHOLDERS — REPLACE BEFORE USE:
#   192.0.2.53                TEST-NET-1 (RFC 5737) documentation address
#   dns.example-loop.invalid  ".invalid" can never resolve — fake on purpose
# Replace both with your loop resolver's address and its TLS hostname
# (the "#name" suffix is the name the TLS certificate is verified against).
#
# Install: copy to /etc/systemd/resolved.conf (merge the [Resolve]
# section into an existing file instead of overwriting blindly), then:
#   sudo systemctl restart systemd-resolved
# Verify with: resolvectl status   (look for "DNSOverTLS: yes" and your
# resolver listed as the current server.)

[Resolve]
DNS=192.0.2.53#dns.example-loop.invalid
# A second loop resolver may be added on the same line, space-separated.
# Do NOT add a foreign FallbackDNS: a fallback outside the loop quietly
# routes lookups back outside it.
DNSOverTLS=yes
DNSSEC=allow-downgrade
Cache=yes
